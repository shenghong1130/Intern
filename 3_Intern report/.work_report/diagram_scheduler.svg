<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900"><rect width="900" height="900" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315c9b"/></marker></defs><g font-family="Microsoft YaHei, Arial" text-anchor="middle"><text x="450" y="42" font-size="30" font-weight="700" fill="#17365d">Request / Lease / Worker 调度流程</text><g fill="#eef4fb" stroke="#315c9b" stroke-width="3"><rect x="260" y="78" width="380" height="62" rx="10"/><rect x="260" y="180" width="380" height="62" rx="10"/><rect x="260" y="282" width="380" height="62" rx="10"/><polygon points="450,385 620,460 450,535 280,460"/><rect x="70" y="590" width="310" height="75" rx="10"/><rect x="520" y="590" width="310" height="75" rx="10"/><rect x="70" y="735" width="310" height="75" rx="10"/><rect x="520" y="735" width="310" height="75" rx="10"/></g><g fill="#17365d" font-size="22"><text x="450" y="118">POST /predict</text><text x="450" y="220">认证并持久化 QUEUED Request</text><text x="450" y="322">Student Lease / FIFO</text><text x="450" y="468">存在 IDLE Worker？</text><text x="225" y="624">Reserve → Deploy → Predict</text><text x="225" y="651" font-size="17">Worker: READY / BUSY</text><text x="675" y="624">HTTP 202 + request_id</text><text x="675" y="651" font-size="17">后台 allocator 等待资源</text><text x="225" y="778">COMPLETED → HTTP 200</text><text x="675" y="778">GET /requests/{id}</text></g><g stroke="#315c9b" stroke-width="4" fill="none" marker-end="url(#a)"><line x1="450" y1="140" x2="450" y2="175"/><line x1="450" y1="242" x2="450" y2="277"/><line x1="450" y1="344" x2="450" y2="380"/><path d="M280 460 L225 585"/><path d="M620 460 L675 585"/><line x1="225" y1="665" x2="225" y2="730"/><line x1="675" y1="665" x2="675" y2="730"/></g><text x="265" y="520" font-size="20" fill="#315c9b">是</text><text x="635" y="520" font-size="20" fill="#315c9b">否</text></g></svg>
